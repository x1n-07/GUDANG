version: '3.8'

services:
  app:
    build: .
    ports:
      - "3007:3007"   # Vite dev server (frontend)
      - "3008:3008"   # Express API (backend)
    environment:
      - DATABASE_URL=file:/app/database/warehouse.db
      - JWT_SECRET=${JWT_SECRET:-warehouse-app-secret-key-2026}
      - PORT=3008
    volumes:
      - .:/app
      # Exclude node_modules from host to use container's version
      - /app/node_modules
    command: ["sh", "-c", "mkdir -p database && npm run dev"]